<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found | Wissen Technology</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; color: #333; }
        .error-code { font-size: 72px; font-weight: bold; color: #e74c3c; margin: 0; }
        .message { font-size: 24px; margin-bottom: 20px; }
        .btn { 
            display: inline-block; 
            padding: 10px 20px; 
            background-color: #0056b3; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="message">Oops! Something went wrong.</div>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    
    <p>If you were trying to log in, please check your credentials and try again.</p>
    
    <hr style="width: 50%; margin: 30px auto;">
    
    <nav>
        <a href="/" class="btn">Return to Home</a>
        <a href="/login" style="margin-left: 15px; color: #0056b3;">Try Logging In Again</a>
    </nav>
</body>
</html>
